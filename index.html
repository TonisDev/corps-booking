<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Κράτηση Ραντεβού</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white p-8 rounded-2xl shadow-lg border border-gray-100">
        <!-- Header Επιχείρησης -->
        <div class="text-center mb-6">
            <h1 id="businessName" class="text-2xl font-bold text-gray-900">Φόρτωση...</h1>
            <p id="businessSubtitle" class="text-sm text-gray-500 mt-1">Κλείστε το ραντεβού σας εύκολα και γρήγορα</p>
        </div>

        <!-- Φόρμα Κράτησης -->
        <form id="bookingForm" class="space-y-4 hidden">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Ονοματεπώνυμο</label>
                <input type="text" id="name" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Τηλέφωνο Επικοινωνίας</label>
                <input type="tel" id="phone" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Υπηρεσία</label>
                <select id="service" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    <option value="">-- Επιλέξτε Υπηρεσία --</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Ημερομηνία</label>
                <input type="date" id="date" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>

            <!-- Επιλογή Ώρας με Slots (Κουμπιά) -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Διαθέσιμες Ώρες</label>
                <div id="slotsContainer" class="grid grid-cols-3 gap-2 mt-2">
                    <p class="col-span-3 text-xs text-gray-400 italic">Επιλέξτε πρώτα ημερομηνία και υπηρεσία...</p>
                </div>
                <!-- Κρυφό input για να κρατάει την επιλεγμένη ώρα για το submit -->
                <input type="hidden" id="selectedTime" required>
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-indigo-600 text-white py-3 rounded-lg font-semibold hover:bg-indigo-700 transition duration-200 shadow-md mt-4">
                Υποβολή Κράτησης
            </button>
        </form>

        <!-- Μηνύματα -->
        <div id="responseMessage" class="mt-4 text-center text-sm font-medium hidden"></div>
        <div id="loadingError" class="text-center text-red-600 text-sm font-medium hidden">Η επιχείρηση δεν βρέθηκε ή υπάρχει πρόβλημα σύνδεσης.</div>
    </div>

    <script>
        const API_BASE_URL = "https://YOUR-WORKER-SUBDOMAIN.workers.dev";

        const urlParams = new URLSearchParams(window.location.search);
        const slug = urlParams.get('slug');

        let businessServices = [];

        async function initPage() {
            if (!slug) {
                document.getElementById('loadingError').textContent = 'Δεν καθορίστηκε επιχείρηση (Missing slug).';
                document.getElementById('loadingError').classList.remove('hidden');
                return;
            }

            try {
                const res = await fetch(`${API_BASE_URL}/api/${slug}/info`);
                if (!res.ok) throw new Error('Business not found');
                
                const data = await res.json();
                businessServices = data.services || [];

                document.getElementById('businessName').textContent = data.name;
                document.getElementById('pageTitle').textContent = `Κράτηση | ${data.name}`;
                
                const serviceSelect = document.getElementById('service');
                businessServices.forEach(s => {
                    const opt = document.createElement('option');
                    opt.value = s.name;
                    opt.setAttribute('data-duration', s.duration || 60);
                    opt.textContent = `${s.name} (${s.duration} min - ${s.price}€)`;
                    serviceSelect.appendChild(opt);
                });

                document.getElementById('bookingForm').classList.remove('hidden');
            } catch (err) {
                document.getElementById('loadingError').classList.remove('hidden');
            }
        }

        // Συνάρτηση παραγωγής slots (π.χ. από 09:00 έως 17:00 ανάλογα με τη διάρκεια)
        async function updateAvailableSlots() {
            const dateVal = document.getElementById('date').value;
            const serviceSelect = document.getElementById('service');
            const slotsContainer = document.getElementById('slotsContainer');
            
            if (!dateVal || !serviceSelect.value) return;

            slotsContainer.innerHTML = '<p class="col-span-3 text-xs text-gray-500">Φόρτωση διαθέσιμων ωρών...</p>';

            try {
                const res = await fetch(`${API_BASE_URL}/api/${slug}/availability?date=${dateVal}`);
                const data = await res.json();
                const occupied = data.occupied || [];

                // Δημιουργία τυπικών ωρών λειτουργίας (π.χ. 09:00 έως 20:00 ανά 1 ώρα)
                // Μπορείς να το προσαρμόσεις ανάλογα με τις ανάγκες σου
                const allSlots = ["09:00", "10:00", "11:00", "12:00", "13:00", "14:00", "15:00", "16:00", "17:00", "18:00", "19:00"];
                
                slotsContainer.innerHTML = '';

                allSlots.forEach(timeStr => {
                    // Έλεγχος αν η ώρα πέφτει πάνω σε κλεισμένο ραντεβού
                    // Απλή λογική επικάλυψης: αν η ώρα υπάρχει στα occupied start_times
                    const isOccupied = occupied.some(occ => {
                        return timeStr >= occ.start_time && timeStr < occ.end_time;
                    });

                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.textContent = timeStr;
                    btn.className = "py-2 px-3 text-sm font-medium rounded-lg border transition duration-150";

                    if (isOccupied) {
                        btn.disabled = true;
                        btn.className += " bg-gray-100 text-gray-400 border-gray-200 cursor-not-allowed line-through";
                    } else {
                        btn.className += " bg-white text-gray-700 border-gray-300 hover:border-indigo-500 hover:bg-indigo-50";
                        btn.onclick = () => {
                            // Αφαίρεση επιλογής από τα υπόλοιπα κουμπιά
                            document.querySelectorAll('#slotsContainer button').forEach(b => {
                                b.classList.remove('bg-indigo-600', 'text-white', 'border-indigo-600');
                                if(!b.disabled) b.classList.add('bg-white', 'text-gray-700');
                            });
                            // Επιλογή αυτού
                            btn.classList.remove('bg-white', 'text-gray-700');
                            btn.classList.add('bg-indigo-600', 'text-white', 'border-indigo-600');
                            document.getElementById('selectedTime').value = timeStr;
                        };
                    }
                    slotsContainer.appendChild(btn);
                });

            } catch (err) {
                slotsContainer.innerHTML = '<p class="col-span-3 text-xs text-red-500">Σφάλμα φόρτωσης ωρών.</p>';
            }
        }

        document.getElementById('date').addEventListener('change', updateAvailableSlots);
        document.getElementById('service').addEventListener('change', updateAvailableSlots);

        // Υποβολή φόρμας
        document.getElementById('bookingForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msgBox = document.getElementById('responseMessage');
            const submitBtn = document.getElementById('submitBtn');
            const selectedTime = document.getElementById('selectedTime').value;

            if (!selectedTime) {
                alert('Παρακαλώ επιλέξτε ώρα ραντεβού.');
                return;
            }
            
            const serviceSelect = document.getElementById('service');
            const selectedOption = serviceSelect.options[serviceSelect.selectedIndex];
            const duration = selectedOption.getAttribute('data-duration') || 60;

            const payload = {
                name: document.getElementById('name').value,
                phone: document.getElementById('phone').value,
                service_name: serviceSelect.value,
                date: document.getElementById('date').value,
                time: selectedTime,
                duration: parseInt(duration)
            };

            submitBtn.disabled = true;
            submitBtn.textContent = 'Αποστολή...';

            try {
                const res = await fetch(`${API_BASE_URL}/api/${slug}/bookings`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();

                msgBox.classList.remove('hidden');
                if (res.ok) {
                    msgBox.className = "mt-4 text-center text-sm font-medium text-green-600";
                    msgBox.textContent = data.message;
                    document.getElementById('bookingForm').reset();
                    document.getElementById('slotsContainer').innerHTML = '<p class="col-span-3 text-xs text-gray-400 italic">Επιλέξτε πρώτα ημερομηνία και υπηρεσία...</p>';
                } else {
                    msgBox.className = "mt-4 text-center text-sm font-medium text-red-600";
                    msgBox.textContent = data.error || 'Προέκυψε σφάλμα.';
                }
            } catch (err) {
                msgBox.classList.add('hidden');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Υποβολή Κράτησης';
            }
        });

        initPage();
    </script>
</body>
</html>
