
<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Κράτηση Ραντεβού</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Flatpickr CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Ορισμός των CSS variables που χρησιμοποιεί το style.css.
           Χωρίς αυτό, τα var(--card-bg) κλπ. είναι undefined και αγνοούνται. */
        :root {
            --bg-color: #f9fafb;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --text-muted: #6b7280;
            --border-color: #f3f4f6;
            --field-bg: #ffffff;
            --field-border: #d1d5db;
            --brand-color: #4f46e5;
        }

        [data-theme="dark"] {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --field-bg: #0f172a;
            --field-border: #475569;
        }

        body {
            background-color: var(--bg-color) !important;
            transition: background-color 0.2s, color 0.2s;
        }

        /* Εφαρμογή του brand_color (dynamic, ανά επιχείρηση) σε ό,τι πριν
           ήταν hardcoded indigo. */
        #submitBtn {
            background-color: var(--brand-color) !important;
            filter: brightness(1);
            transition: filter 0.15s;
        }
        #submitBtn:hover {
            filter: brightness(0.9);
        }
        input:focus, select:focus, textarea:focus {
            border-color: var(--brand-color) !important;
            box-shadow: 0 0 0 2px color-mix(in srgb, var(--brand-color) 30%, transparent) !important;
            outline: none !important;
        }
        #businessAddress, #businessPhone {
            color: var(--brand-color) !important;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white p-8 rounded-2xl shadow-lg border border-gray-100 my-8">

        <!-- Loading State Αρχικής Φόρτωσης Επιχείρησης -->
        <div id="initialLoader" class="text-center py-8">
            <svg class="animate-spin h-8 w-8 text-indigo-600 mx-auto mb-3" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <p class="text-sm text-gray-500">Φόρτωση επιχείρησης...</p>
        </div>

        <!-- Header Επιχείρησης -->
        <div id="businessHeader" class="text-center mb-6 hidden">
            <h1 id="businessName" class="text-2xl font-bold text-gray-900"></h1>
            <p id="businessSubtitle" class="text-sm text-gray-500 mt-1">Κλείστε το ραντεβού σας εύκολα και γρήγορα</p>

            <!-- Διεύθυνση & Τηλέφωνο Επιχείρησης -->
            <div id="businessMeta" class="mt-3 pt-3 border-t border-gray-100 text-xs text-gray-500 space-y-1 hidden">
                <p id="businessAddressContainer">📍 <a id="businessAddress" href="#" target="_blank" class="text-indigo-600 hover:underline"></a></p>
                <p id="businessPhoneContainer">📞 <a id="businessPhone" href="#" class="text-indigo-600 hover:underline"></a></p>
            </div>
        </div>

        <!-- Φόρμα Κράτησης -->
        <form id="bookingForm" class="space-y-4 hidden">

            <!-- Honeypot field κατά spam -->
            <div style="display:none !important;">
                <input type="text" name="website" id="website" tabindex="-1" autocomplete="off">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Ονοματεπώνυμο *</label>
                <input type="text" id="name" required placeholder="π.χ. Μαρία Παπαδοπούλου" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Τηλέφωνο Επικοινωνίας *</label>
                <input type="tel" id="phone" required placeholder="π.χ. 6912345678" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Instagram Username (προαιρετικό)</label>
                <input type="text" id="instagram" placeholder="π.χ. maria_massage" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Υπηρεσία *</label>
                <select id="service" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    <option value="">-- Επιλέξτε Υπηρεσία --</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Ημερομηνία *</label>
                <input type="text" id="date" required placeholder="Επιλέξτε ημερομηνία" readonly class="w-full px-4 py-2 border rounded-lg bg-white cursor-pointer focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Διαθέσιμη Ώρα *</label>
                <select id="timeSlot" required disabled class="w-full px-4 py-2 border rounded-lg bg-gray-50 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    <option value="">-- Επιλέξτε πρώτα Ημερομηνία & Υπηρεσία --</option>
                </select>
                <p id="slotHint" class="text-xs text-gray-400 mt-1">Εμφανίζονται αυτόματα μόνο οι διαθέσιμες ώρες.</p>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Σημειώσεις / Παρατηρήσεις</label>
                <textarea id="notes" rows="2" placeholder="Π.χ. Ιδιαίτερες προτιμήσεις..." class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none"></textarea>
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-indigo-600 text-white py-3 rounded-lg font-semibold hover:bg-indigo-700 transition duration-200 shadow-md flex items-center justify-center space-x-2">
                <span id="submitBtnText">Υποβολή Αιτήματος Κράτησης</span>
                <svg id="submitSpinner" class="animate-spin h-5 w-5 text-white hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            </button>
        </form>

        <!-- Μηνύματα Επιτυχίας / Google Calendar Action -->
        <div id="responseContainer" class="mt-4 hidden text-center">
            <div id="responseMessage" class="text-sm font-medium mb-3"></div>
            <a id="gcalBtn" href="#" target="_blank" class="inline-flex items-center justify-center space-x-2 bg-emerald-600 text-white px-4 py-2.5 rounded-lg text-sm font-semibold hover:bg-emerald-700 transition duration-200 shadow-sm hidden">
                📅 Προσθήκη στο Google Calendar
            </a>
        </div>

        <div id="loadingError" class="text-center text-red-600 text-sm font-medium hidden mt-4">Η επιχείρηση δεν βρέθηκε ή υπάρχει πρόβλημα σύνδεσης.</div>
    </div>

    <!-- Flatpickr JS & Ελληνική γλώσσα -->
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://npmcdn.com/flatpickr/dist/l10n/gr.js"></script>

    <script>
        const API_BASE_URL = "https://corporate-bookings.tonisdevv.workers.dev";
        const urlParams = new URLSearchParams(window.location.search);
        const business_code = urlParams.get('business_code');

        const dateInput = document.getElementById('date');
        const timeSlotSelect = document.getElementById('timeSlot');
        const serviceSelect = document.getElementById('service');
        const bookingForm = document.getElementById('bookingForm');
        const responseContainer = document.getElementById('responseContainer');
        const responseMessage = document.getElementById('responseMessage');
        const gcalBtn = document.getElementById('gcalBtn');
        const slotHint = document.getElementById('slotHint');
        const initialLoader = document.getElementById('initialLoader');
        const businessHeader = document.getElementById('businessHeader');

        let businessData = null;
        // Guards against a slow /availability response landing after the user
        // has already changed the date or service (stale-response race condition).
        let availabilityRequestId = 0;

        const timeToMinutes = (timeStr) => {
            const [h, m] = timeStr.split(':').map(Number);
            return h * 60 + m;
        };

        const minutesToTime = (totalMins) => {
            const h = Math.floor(totalMins / 60).toString().padStart(2, '0');
            const m = (totalMins % 60).toString().padStart(2, '0');
            return `${h}:${m}`;
        };

        // Μετατρέπει working_hours + work_days του tenant σε λίστα διαστημάτων
        // (σε λεπτά) για τη συγκεκριμένη ημερομηνία, ή [] αν η μέρα είναι κλειστή.
        function getShiftsForDate(dateStr) {
            const workDays = (businessData && businessData.work_days && businessData.work_days.length > 0)
                ? businessData.work_days
                : [1, 2, 3, 4, 5];
            const workingHours = (businessData && businessData.working_hours && businessData.working_hours.length > 0)
                ? businessData.working_hours
                : [{ start: "09:00", end: "21:00" }];

            // dateStr is 'YYYY-MM-DD'; avoid `new Date(dateStr)` timezone issues
            // by constructing the date from parts explicitly.
            const [y, m, d] = dateStr.split('-').map(Number);
            const dayOfWeek = new Date(y, m - 1, d).getDay(); // 0=Κυρ ... 6=Σαβ

            if (!workDays.includes(dayOfWeek)) return [];

            return workingHours.map(sh => ({
                start: timeToMinutes(sh.start),
                end: timeToMinutes(sh.end)
            }));
        }

        async function initPage() {
            if (!business_code) {
                initialLoader.classList.add('hidden');
                document.getElementById('loadingError').textContent = 'Δεν καθορίστηκε επιχείρηση (Missing business_code).';
                document.getElementById('loadingError').classList.remove('hidden');
                return;
            }

            try {
                const res = await fetch(`${API_BASE_URL}/api/${business_code}/info`);
                if (!res.ok) throw new Error('Business not found');

                businessData = await res.json();

                const clientTheme = businessData.client_theme || 'light';
                document.body.setAttribute('data-theme', clientTheme);

                if (businessData.brand_color) {
                    document.documentElement.style.setProperty('--brand-color', businessData.brand_color);
                }
                document.getElementById('businessName').textContent = businessData.name;
                document.getElementById('pageTitle').textContent = `Κράτηση Ραντεβού | ${businessData.name}`;

                if (businessData.address) {
                    const addrLink = document.getElementById('businessAddress');
                    addrLink.textContent = businessData.address;
                    addrLink.href = `https://maps.google.com/?q=${encodeURIComponent(businessData.address)}`;
                    document.getElementById('businessMeta').classList.remove('hidden');
                }
                if (businessData.phone) {
                    const phoneLink = document.getElementById('businessPhone');
                    phoneLink.textContent = businessData.phone;
                    phoneLink.href = `tel:${businessData.phone}`;
                    document.getElementById('businessMeta').classList.remove('hidden');
                }

                businessHeader.classList.remove('hidden');

                (businessData.services || []).forEach(s => {
                    const opt = document.createElement('option');
                    opt.value = s.name;
                    opt.setAttribute('data-duration', s.duration || 60);
                    opt.textContent = `${s.name} (${s.duration} min - ${s.price}€)`;
                    serviceSelect.appendChild(opt);
                });

                initialLoader.classList.add('hidden');
                bookingForm.classList.remove('hidden');

            } catch (err) {
                initialLoader.classList.add('hidden');
                document.getElementById('loadingError').classList.remove('hidden');
            }
        }

        const fp = flatpickr(dateInput, {
            locale: 'gr',
            dateFormat: 'Y-m-d',
            minDate: 'today',
            onChange: function (selectedDates, dateStr) {
                if (dateStr && serviceSelect.value) {
                    fetchAvailableSlots(dateStr);
                }
            }
        });

        serviceSelect.addEventListener('change', () => {
            if (dateInput.value) {
                fetchAvailableSlots(dateInput.value);
            }
        });

        async function fetchAvailableSlots(dateStr) {
            const requestId = ++availabilityRequestId;

            timeSlotSelect.disabled = true;
            timeSlotSelect.innerHTML = '<option value="">Υπολογισμός διαθεσιμότητας...</option>';
            slotHint.textContent = 'Παρακαλώ περιμένετε...';
            slotHint.className = 'text-xs text-gray-400 mt-1';

            const selectedOption = serviceSelect.options[serviceSelect.selectedIndex];
            const duration = parseInt(selectedOption.getAttribute('data-duration')) || 60;
            const bufferMinutes = (businessData && businessData.buffer_minutes) || 0;

            // Η μέρα μπορεί να είναι κλειστή βάσει work_days, ανεξάρτητα από τα ραντεβού.
            const shifts = getShiftsForDate(dateStr);
            if (shifts.length === 0) {
                if (requestId !== availabilityRequestId) return;
                timeSlotSelect.innerHTML = '<option value="">Κλειστό αυτή την ημέρα</option>';
                slotHint.textContent = '⚠️ Η επιχείρηση είναι κλειστή αυτή την ημέρα.';
                slotHint.className = 'text-xs text-amber-600 mt-1 font-medium';
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/api/${business_code}/availability?date=${dateStr}`);
                if (!response.ok) throw new Error('Availability request failed');
                const data = await response.json();

                // Αγνόησε την απάντηση αν ο χρήστης άλλαξε ημερομηνία/υπηρεσία στο μεταξύ.
                if (requestId !== availabilityRequestId) return;

                const occupied = data.occupied || [];
                const stepMinutes = 15;
                let freeSlots = [];

                shifts.forEach(shift => {
                    for (let currentMins = shift.start; currentMins + duration <= shift.end; currentMins += stepMinutes) {
                        const slotStartMins = currentMins;
                        const slotEndMins = currentMins + duration + bufferMinutes;

                        const isOverlapping = occupied.some(occ => {
                            const occStart = timeToMinutes(occ.start_time);
                            const occEnd = timeToMinutes(occ.end_time);
                            return (slotStartMins < occEnd && slotEndMins > occStart);
                        });

                        if (!isOverlapping) {
                            freeSlots.push(minutesToTime(slotStartMins));
                        }
                    }
                });

                // Αφαίρεση τυχόν διπλότυπων ωρών αν επικαλύπτονται βάρδιες.
                freeSlots = [...new Set(freeSlots)].sort();

                timeSlotSelect.innerHTML = '';

                if (freeSlots.length === 0) {
                    timeSlotSelect.innerHTML = '<option value="">Δεν υπάρχουν διαθέσιμες ώρες</option>';
                    slotHint.textContent = '⚠️ Η ημέρα είναι πλήρης.';
                    slotHint.className = 'text-xs text-amber-600 mt-1 font-medium';
                } else {
                    timeSlotSelect.innerHTML = '<option value="">-- Επιλέξτε Διαθέσιμη Ώρα --</option>';
                    freeSlots.forEach(slot => {
                        const opt = document.createElement('option');
                        opt.value = slot;
                        opt.textContent = slot;
                        timeSlotSelect.appendChild(opt);
                    });
                    timeSlotSelect.disabled = false;
                    timeSlotSelect.classList.remove('bg-gray-50');
                    slotHint.textContent = `✨ Βρέθηκαν ${freeSlots.length} διαθέσιμες επιλογές.`;
                    slotHint.className = 'text-xs text-green-600 mt-1 font-medium';
                }

            } catch (err) {
                if (requestId !== availabilityRequestId) return;
                timeSlotSelect.innerHTML = '<option value="">Σφάλμα φόρτωσης</option>';
                slotHint.textContent = '❌ Αποτυχία σύνδεσης με τον διακομιστή.';
                slotHint.className = 'text-xs text-red-600 mt-1 font-medium';
            }
        }

        function generateGoogleCalendarUrl(serviceName, dateStr, timeStr, durationMinutes) {
            const cleanDate = dateStr.replace(/-/g, '');
            const startCleanTime = timeStr.replace(/:/g, '') + '00';

            const startMins = timeToMinutes(timeStr);
            const endMins = startMins + durationMinutes;
            const endCleanTime = minutesToTime(endMins).replace(/:/g, '') + '00';

            const startDateTime = `${cleanDate}T${startCleanTime}`;
            const endDateTime = `${cleanDate}T${endCleanTime}`;

            const title = encodeURIComponent(`Ραντεβού: ${serviceName} (${businessData?.name || ''})`);
            const details = encodeURIComponent(`Κράτηση ραντεβού μέσω ${businessData?.name || 'πλατφόρμας'}.`);
            const location = encodeURIComponent(businessData?.address || '');

            return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${startDateTime}/${endDateTime}&details=${details}&location=${location}`;
        }

        bookingForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            if (document.getElementById('website').value !== '') return;

            // Πρόσθετος client-side έλεγχος: αν δεν έχει επιλεγεί έγκυρη ώρα, μην στείλεις.
            if (!timeSlotSelect.value) {
                responseContainer.classList.remove('hidden');
                gcalBtn.classList.add('hidden');
                responseMessage.className = 'text-sm font-medium text-red-600 mb-3';
                responseMessage.textContent = 'Παρακαλώ επιλέξτε μια διαθέσιμη ώρα.';
                return;
            }

            const submitBtn = document.getElementById('submitBtn');
            const submitBtnText = document.getElementById('submitBtnText');
            const submitSpinner = document.getElementById('submitSpinner');

            submitBtn.disabled = true;
            submitBtnText.textContent = 'Αποστολή...';
            submitSpinner.classList.remove('hidden');
            responseContainer.classList.add('hidden');
            gcalBtn.classList.add('hidden');

            const selectedOption = serviceSelect.options[serviceSelect.selectedIndex];
            const duration = parseInt(selectedOption.getAttribute('data-duration')) || 60;
            const dateVal = dateInput.value;
            const timeVal = timeSlotSelect.value;
            const serviceNameVal = serviceSelect.value;

            const payload = {
                name: document.getElementById('name').value,
                phone: document.getElementById('phone').value,
                instagram: document.getElementById('instagram').value,
                service_name: serviceNameVal,
                duration: duration,
                date: dateVal,
                time: timeVal,
                notes: document.getElementById('notes').value
            };

            try {
                const res = await fetch(`${API_BASE_URL}/api/${business_code}/bookings`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();

                responseContainer.classList.remove('hidden');
                if (res.ok) {
                    responseMessage.className = "text-sm font-medium text-green-600 mb-3";
                    responseMessage.textContent = data.message || 'Η κράτηση ολοκληρώθηκε επιτυχώς!';

                    const gcalUrl = generateGoogleCalendarUrl(serviceNameVal, dateVal, timeVal, duration);
                    gcalBtn.href = gcalUrl;
                    gcalBtn.classList.remove('hidden');

                    bookingForm.reset();
                    timeSlotSelect.disabled = true;
                    timeSlotSelect.innerHTML = '<option value="">-- Επιλέξτε πρώτα Ημερομηνία & Υπηρεσία --</option>';
                    slotHint.textContent = 'Εμφανίζονται αυτόματα μόνο οι διαθέσιμες ώρες.';
                    slotHint.className = 'text-xs text-gray-400 mt-1';
                    fp.clear();
                } else {
                    responseMessage.className = "text-sm font-medium text-red-600 mb-3";
                    responseMessage.textContent = data.error || 'Προέκυψε σφάλμα.';
                }
            } catch (err) {
                responseContainer.classList.remove('hidden');
                responseMessage.className = "text-sm font-medium text-red-600 mb-3";
                responseMessage.textContent = 'Σφάλμα σύνδεσης με τον διακομιστή.';
            } finally {
                submitBtn.disabled = false;
                submitBtnText.textContent = 'Υποβολή Αιτήματος Κράτησης';
                submitSpinner.classList.add('hidden');
            }
        });

        initPage();
    </script>
</body>
</html>
