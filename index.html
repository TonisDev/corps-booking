<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Κράτηση Ραντεβού</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Flatpickr CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white p-8 rounded-2xl shadow-lg border border-gray-100 my-8">
        <!-- Header Επιχείρησης -->
        <div class="text-center mb-6">
            <h1 id="businessName" class="text-2xl font-bold text-gray-900">Φόρτωση...</h1>
            <p id="businessSubtitle" class="text-sm text-gray-500 mt-1">Κλείστε το ραντεβού σας εύκολα και γρήγορα</p>
        </div>

        <!-- Φόρμα Κράτησης -->
        <form id="bookingForm" class="space-y-4 hidden">
            
            <!-- Honeypot field against bots (Κρυφό πεδίο) -->
            <div style="display:none !important;">
                <input type="text" name="website" id="website" tabindex="-1" autocomplete="off">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Ονοματεπώνυμο *</label>
                <input type="text" id="name" required placeholder="π.χ. Μαρία Παπαδοπούλου" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Τηλέφωνο Επικοινωνίας *</label>
                <input type="tel" id="phone" required placeholder="π.χ. 6912345678" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Instagram Username (προαιρετικό)</label>
                <input type="text" id="instagram" placeholder="π.χ. maria_massage" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Υπηρεσία *</label>
                <select id="service" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    <option value="">-- Επιλέξτε Υπηρεσία --</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Ημερομηνία *</label>
                <input type="text" id="date" required placeholder="Επιλέξτε ημερομηνία" readonly class="w-full px-4 py-2 border rounded-lg bg-white cursor-pointer focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>

            <div>
<label class="block text-sm font-medium text-gray-700 mb-1">Διαθέσιμη Ώρα *</label>
                <div class="grid grid-cols-2 gap-2">
                    <!-- Dropdown Ώρας -->
                    <select id="hourSelect" required disabled class="w-full px-4 py-2 border rounded-lg bg-gray-50 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        <option value="">-- Ώρα --</option>
                        <option value="09">09:00</option>
                        <option value="10">10:00</option>
                        <option value="11">11:00</option>
                        <option value="12">12:00</option>
                        <option value="13">13:00</option>
                        <option value="14">14:00</option>
                        <option value="15">15:00</option>
                        <option value="16">16:00</option>
                        <option value="17">17:00</option>
                        <option value="18">18:00</option>
                        <option value="19">19:00</option>
                        <option value="20">20:00</option>
                    </select>

                    <!-- Dropdown Ημιώρου -->
                    <select id="minuteSelect" required disabled class="w-full px-4 py-2 border rounded-lg bg-gray-50 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        <option value="">-- Λεπτά --</option>
                        <option value="00">:00 ακριβώς</option>
                        <option value="30">:30 μισή</option>
                    </select>
                </div>
                <!-- Μήνυμα διαθεσιμότητας ή σφάλματος -->
                <p id="timeValidationHint" class="text-xs text-red-500 mt-1 hidden"></p>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Σημειώσεις / Παρατηρήσεις</label>
                <textarea id="notes" rows="2" placeholder="Π.χ. Ιδιαίτερες προτιμήσεις..." class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none"></textarea>
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-indigo-600 text-white py-3 rounded-lg font-semibold hover:bg-indigo-700 transition duration-200 shadow-md">
                Υποβολή Αιτήματος Κράτησης
            </button>
        </form>

        <!-- Μηνύματα Επιτυχίας / Σφάλματος -->
        <div id="responseMessage" class="mt-4 text-center text-sm font-medium hidden"></div>
        <div id="loadingError" class="text-center text-red-600 text-sm font-medium hidden">Η επιχείρηση δεν βρέθηκε ή υπάρχει πρόβλημα σύνδεσης.</div>
    </div>

    <!-- Flatpickr JS & Ελληνική γλώσσα -->
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://npmcdn.com/flatpickr/dist/l10n/gr.js"></script>

    <script>
        // 1. Ρύθμιση του Worker URL σου
        const API_BASE_URL = "https://corporate-bookings.tonisdevv.workers.dev/";

        // 2. Ανάγνωση slug από το URL (π.χ. ?slug=maria-massage)
        const urlParams = new URLSearchParams(window.location.search);
        const slug = urlParams.get('slug');

        const dateInput = document.getElementById('date');
        const timeSelect = document.getElementById('time');
        const serviceSelect = document.getElementById('service');
        const bookingForm = document.getElementById('bookingForm');
        const responseMessage = document.getElementById('responseMessage');

        let businessServices = [];

        // Μετατροπή "HH:MM" σε λεπτά για τους υπολογισμούς επικάλυψης
        const timeToMinutes = (timeStr) => {
            const [h, m] = timeStr.split(':').map(Number);
            return h * 60 + m;
        };

        async function initPage() {
            if (!slug) {
                document.getElementById('loadingError').textContent = 'Δεν καθορίστηκε επιχείρηση (Missing slug).';
                document.getElementById('loadingError').classList.remove('hidden');
                return;
            }

            try {
                const res = await fetch(`${API_BASE_URL}/api/${slug}/info`);
                if (!res.ok) throw new Error('Business not found');
                
                const data = await res.json();
                businessServices = data.services || [];

                document.getElementById('businessName').textContent = data.name;
                document.getElementById('pageTitle').textContent = `Κράτηση | ${data.name}`;
                
                businessServices.forEach(s => {
                    const opt = document.createElement('option');
                    opt.value = s.name;
                    opt.setAttribute('data-duration', s.duration || 60);
                    opt.textContent = `${s.name} (${s.duration} min - ${s.price}€)`;
                    serviceSelect.appendChild(opt);
                });

                bookingForm.classList.remove('hidden');

            } catch (err) {
                document.getElementById('loadingError').classList.remove('hidden');
            }
        }

        // 3. Αρχικοποίηση Flatpickr Calendar στα ελληνικά
        const fp = flatpickr(dateInput, {
            locale: 'gr',
            dateFormat: 'Y-m-d',
            minDate: 'today',
            onChange: function(selectedDates, dateStr) {
                if (dateStr && serviceSelect.value) {
                    fetchAvailableSlots(dateStr);
                }
            }
        });

        // Αν αλλάξει υπηρεσία ενώ έχει επιλεχθεί ημερομηνία, ξαναυπολογίζουμε τα slots
        serviceSelect.addEventListener('change', () => {
            if (dateInput.value) {
                fetchAvailableSlots(dateInput.value);
            }
        });

        // 4. Συνάρτηση φόρτωσης διαθέσιμων ωρών
        async function fetchAvailableSlots(dateStr) {
            timeSelect.disabled = true;
            timeSelect.innerHTML = '<option value="">Φόρτωση διαθεσιμοτήτων...</option>';

            const ALL_SLOTS = [
                "09:00", "10:00", "11:00", "12:00", "13:00", "14:00",
                "15:00", "16:00", "17:00", "18:00", "19:00", "20:00"
            ];

            const selectedOption = serviceSelect.options[serviceSelect.selectedIndex];
            const duration = parseInt(selectedOption.getAttribute('data-duration')) || 60;

            try {
                const response = await fetch(`${API_BASE_URL}/api/${slug}/availability?date=${dateStr}`);
                const data = await response.json();
                const occupied = data.occupied || [];

                // Φιλτράρισμα ωρών βάσει διάρκειας και επικάλυψης
                const freeSlots = ALL_SLOTS.filter(slotStart => {
                    const startMins = timeToMinutes(slotStart);
                    const endMins = startMins + duration;

                    const isOverlapping = occupied.some(occ => {
                        const occStart = timeToMinutes(occ.start_time);
                        const occEnd = timeToMinutes(occ.end_time);
                        return (startMins < occEnd && endMins > occStart);
                    });

                    return !isOverlapping;
                });

                timeSelect.innerHTML = '';

                if (freeSlots.length === 0) {
                    timeSelect.innerHTML = '<option value="">Δεν υπάρχουν διαθέσιμες ώρες</option>';
                    return;
                }

                timeSelect.innerHTML = '<option value="">-- Επιλέξτε Ώρα --</option>';
                freeSlots.forEach(slot => {
                    const opt = document.createElement('option');
                    opt.value = slot;
                    opt.textContent = slot;
                    timeSelect.appendChild(opt);
                });

                timeSelect.disabled = false;

            } catch (err) {
                timeSelect.innerHTML = '<option value="">Αποτυχία φόρτωσης ωρών</option>';
            }
        }

        // 5. Υποβολή Φόρμας
        bookingForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            // Έλεγχος Honeypot (Anti-bot)
            if (document.getElementById('website').value !== '') {
                return;
            }

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Αποστολή...';
            responseMessage.classList.add('hidden');

            const selectedOption = serviceSelect.options[serviceSelect.selectedIndex];
            const duration = parseInt(selectedOption.getAttribute('data-duration')) || 60;

            const payload = {
                name: document.getElementById('name').value,
                phone: document.getElementById('phone').value,
                instagram: document.getElementById('instagram').value,
                service_name: serviceSelect.value,
                duration: duration,
                date: dateInput.value,
                time: timeSelect.value,
                notes: document.getElementById('notes').value
            };

            try {
                const res = await fetch(`${API_BASE_URL}/api/${slug}/bookings`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();

                responseMessage.classList.remove('hidden');
                if (res.ok) {
                    responseMessage.className = "mt-4 text-center text-sm font-medium text-green-600";
                    responseMessage.textContent = data.message || 'Η κράτηση ολοκληρώθηκε επιτυχώς!';
                    bookingForm.reset();
                    timeSelect.disabled = true;
                    timeSelect.innerHTML = '<option value="">-- Επιλέξτε πρώτα Ημερομηνία --</option>';
                    fp.clear();
                } else {
                    responseMessage.className = "mt-4 text-center text-sm font-medium text-red-600";
                    responseMessage.textContent = data.error || 'Προέκυψε σφάλμα.';
                }
            } catch (err) {
                responseMessage.classList.remove('hidden');
                responseMessage.className = "mt-4 text-center text-sm font-medium text-red-600";
                responseMessage.textContent = 'Σφάλμα σύνδεσης με τον διακομιστή.';
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Υποβολή Αιτήματος Κράτησης';
            }
        });

        initPage();
    </script>
</body>
</html>
